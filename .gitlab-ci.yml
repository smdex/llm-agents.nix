# Fork maintenance pipeline for the GitLab-hosted mirror of
# numtide/llm-agents.nix. Mirrors .github/workflows/{sync-upstream,
# update-fork,auto-merge}.yml without modifying them; all logic lives in
# scripts/ci (shared with the Woodpecker pipelines).
#
# Runs main sync/update/merge, then chiki rebase/update/merge, on the
# protected default branch for schedules and manual web pipelines only.
# The pipeline commit must already contain the chiki-capable scripts.
# MR validation runs without maintenance credentials.
#
# Enable the schedule in exactly ONE CI system: either the GitLab
# schedule below or the Woodpecker cron — not both (they are redundant;
# resource_group serializes GitLab pipelines only).
#
# Configure masked, protected GL_TOKEN and GL_CHIKI_TOKEN variables scoped to
# main-maintenance and chiki-maintenance respectively. Each needs API/push
# permissions for its branch and update MRs.
# FORK_UPDATE_PACKAGES and CHIKI_UPDATE_PACKAGES optionally select packages
# for each branch; otherwise detect fork-only and chiki-modified packages.
# MERGE_WAIT_TIMEOUT defaults to 1800 seconds.
# A shared resource group serializes jobs, not entire pipelines: overlapping
# chains or external writers can make CHIKI_BASE stale, causing a safe failure.
stages:
  - validate
  - main
  - chiki
workflow:
  rules:
    # Scheduled maintenance (configure the schedule for the default branch).
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Manual "Run pipeline" from the UI.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # Validation pipelines for merge requests.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Plain pushes never trigger this pipeline.
    - when: never
default:
  # Any image shipping nix works: every script brings its own tools via
  # nix shebangs (see scripts/generate-package-docs.nu for the pattern).
  image: $CI_NIX_IMAGE
  tags: [usa-docker-nix]
  before_script:
    - |
      export PATH="/nix/var/nix/profiles/default/bin:$PATH"
      if command -v determinate-nixd >/dev/null 2>&1; then
        if ! NIX_REMOTE=daemon nix store ping >/dev/null 2>&1; then
          rm -f /nix/var/nix/daemon-socket/socket
          nohup env -u NIX_REMOTE nix-daemon --daemon >/tmp/nix-daemon.log 2>&1 &
          for i in $(seq 1 60); do
            NIX_REMOTE=daemon nix store ping >/dev/null 2>&1 && break
            sleep 0.5
          done
        fi
        export NIX_REMOTE=daemon
        nix store ping
      fi
variables:
  NIX_CONFIG: "experimental-features = nix-command flakes"
  GIT_DEPTH: "0"
  GL_SERVER_URL: "$CI_SERVER_URL"
  GL_PROJECT_PATH: "$CI_PROJECT_PATH"
  DEFAULT_BRANCH: "$CI_DEFAULT_BRANCH"
  GL_PROJECT_URL: "$CI_PROJECT_URL"
.maintenance:
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /\A(schedule|web)\z/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  resource_group: fork-maintenance
.main-maintenance:
  extends: .maintenance
  environment:
    name: main-maintenance
.chiki-maintenance:
  extends: .maintenance
  environment:
    name: chiki-maintenance
  before_script:
    - !reference [default, before_script]
    - export GL_TOKEN="${GL_CHIKI_TOKEN:?GL_CHIKI_TOKEN is required}"
.update-packages:
  # Keep successfully published updates mergeable after partial failures.
  allow_failure:
    exit_codes: [1]
  script:
    - |
      set -f
      if [ "$UPDATE_BRANCH" = chiki ]; then
        packages="${CHIKI_UPDATE_PACKAGES:-$(bash scripts/ci/detect-chiki-packages.sh)}"
        if [ -z "$packages" ]; then exit 0; fi
        ./scripts/ci/update_fork_packages.py --branch "$UPDATE_BRANCH" --packages $packages
      elif [ -n "${FORK_UPDATE_PACKAGES:-}" ]; then
        ./scripts/ci/update_fork_packages.py --branch "$UPDATE_BRANCH" --packages $FORK_UPDATE_PACKAGES
      else
        ./scripts/ci/update_fork_packages.py --branch "$UPDATE_BRANCH"
      fi
sync-upstream:
  extends: .main-maintenance
  stage: main
  script:
    - nix shell nixpkgs#git --command git fetch origin "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}"
    - nix shell nixpkgs#git --command sh -c 'printf "CHIKI_BASE=%s\n" "$(git rev-parse "origin/${CI_DEFAULT_BRANCH}")" > chiki-base.env'
    - ./scripts/ci/sync-upstream.sh
  artifacts:
    when: always
    reports:
      dotenv: chiki-base.env
    paths: [chiki-base.env]
update-fork-packages:
  extends: [.main-maintenance, .update-packages]
  stage: main
  needs: ["sync-upstream"]
  variables:
    UPDATE_BRANCH: "$CI_DEFAULT_BRANCH"
merge-update-mrs:
  extends: .main-maintenance
  stage: main
  needs: ["update-fork-packages"]
  script:
    - ./scripts/ci/merge_update_mrs.py
rebase-chiki:
  extends: .chiki-maintenance
  stage: chiki
  needs:
    - job: sync-upstream
      artifacts: true
    - job: merge-update-mrs
      artifacts: false
  variables:
    SYNC_BRANCH: chiki
  script:
    - export CHIKI_BASE="$(cut -d= -f2 chiki-base.env)"
    - test -n "$CHIKI_BASE"
    - ./scripts/ci/sync-upstream.sh
update-chiki-packages:
  extends: [.chiki-maintenance, .update-packages]
  stage: chiki
  needs: ["rebase-chiki"]
  variables:
    UPDATE_BRANCH: chiki
  before_script:
    - !reference [default, before_script]
    - export GL_TOKEN="${GL_CHIKI_TOKEN:?GL_CHIKI_TOKEN is required}"
    - nix shell nixpkgs#git --command git fetch origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/chiki:refs/remotes/origin/chiki"
merge-chiki-update-mrs:
  extends: .chiki-maintenance
  stage: chiki
  needs: ["update-chiki-packages"]
  variables:
    DEFAULT_BRANCH: chiki
  script:
    - ./scripts/ci/merge_update_mrs.py
validate-update-mr:
  stage: validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - MR_SOURCE_BRANCH="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" MR_TARGET_BRANCH="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ./scripts/ci/validate-mr.sh
